<!DOCTYPE html>
<html class="h-full" lang="it">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>CineMad Chat</title>
  <!-- Tailwind CSS v3 CDN with plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- Configurazione Tailwind Esterna -->
  <script src="tailwind-config.js"></script>
  <!-- CSS Esterno -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="h-full bg-slate-900 flex items-center justify-center p-0 sm:p-4 select-none">
  <!-- BEGIN: ChatWidgetContainer -->
  <div
    class="w-full max-w-md h-full sm:h-[844px] sm:max-h-[92vh] flex flex-col bg-[#f8fafc] sm:rounded-3xl overflow-hidden shadow-2xl relative"
    data-purpose="chat-widget">

    <!-- BEGIN: Header -->
    <header class="bg-[#0f172a] text-white px-5 py-4 flex items-center justify-between z-10 shrink-0 shadow-md"
      data-purpose="chat-header">
      <div class="flex items-center gap-3.5">
        <div
          class="w-9 h-9 rounded-2xl bg-cyan-950/60 border border-cyan-500/30 flex items-center justify-center overflow-hidden shadow-inner">
          <img src="robot.png" alt="Bot Avatar" class="w-full h-full object-cover">
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-semibold tracking-tight text-white leading-tight">CineMad</h1>
            <span
              class="text-[10px] font-medium bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full border border-cyan-500/30">AI
              Cinema</span>
          </div>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-cyan-400 inline-block animate-pulse"></span>
            <span class="text-xs text-slate-400 font-normal tracking-wide lowercase">online</span>
          </div>
        </div>
      </div>
      <!-- CineMad Hub spostato a destra con ml-auto -->
      <div
        class="ml-auto text-xs font-medium bg-slate-800/80 text-slate-300 px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner">
        CineMad Hub
      </div>
    </header>
    <!-- END: Header -->

    <!-- BEGIN: ChatHistory (Generato dinamicamente tramite array di oggetti) -->
    <main id="chat-history" class="chat-scroll-area flex-1 overflow-y-auto px-4 py-4 space-y-4 bg-[#f8fafc]"
      data-purpose="chat-history">
      <!-- I messaggi vengono inseriti automaticamente da main.js -->
    </main>
    <!-- END: ChatHistory -->

    <!-- BEGIN: InputBar -->
    <footer class="bg-[#0f172a] p-3.5 sm:pb-4 pb-7 border-t border-slate-800/50" data-purpose="chat-input-bar">
      <form class="flex items-center gap-2.5" data-purpose="message-form" id="chat-form">
        <div class="relative flex-1 flex items-center">
          <input id="chat-input"
            class="w-full bg-[#1e293b] border border-slate-700/60 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-cyan-500 focus:border-cyan-500 transition-colors"
            placeholder="Scrivi un messaggio..." type="text">
        </div>
        <button aria-label="Invia messaggio"
          class="w-10 h-10 rounded-xl bg-cyan-500 hover:bg-cyan-400 active:scale-95 text-slate-950 flex items-center justify-center shrink-0 transition-transform duration-100 shadow-md focus:outline-none cursor-pointer"
          type="submit">
          <svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" stroke-linecap="round"
            stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <line x1="12" x2="12" y1="19" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
    </footer>
    <!-- END: InputBar -->

  </div>
  <!-- END: ChatWidgetContainer -->

  <script src="main.js"></script>
</body>

</html>
